name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Rust stable
        run: rustup default stable-msvc
      - name: Install dependencies
        run: npm ci
      - name: Released window configuration preflight
        run: npm run check:desktop
      - name: Frontend tests
        run: npm test
      - name: Build Windows app and NSIS installer
        run: npm run installer -- --ci --config src-tauri/tauri.test.conf.json
      - name: Native audio-analysis and window-guard tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --release
      - name: Upload unsigned test build (not a public release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Vsualize-Windows-test-build
          if-no-files-found: error
          path: |
            src-tauri/target/release/vsualize.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
            README.md
            docs/guides/known-limitations.md
